name: Release

# Cut a release by pushing a semver tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  id-token: write # cosign keyless signing via the OIDC token

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the changelog and version resolve
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Tooling GoReleaser shells out to: cosign (signing) and syft (SBOMs).
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on <owner>/homebrew-tap, stored as a repo
          # secret. Omit this secret (and the homebrew_casks block in
          # .goreleaser.yaml) if you do not publish a Homebrew tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # A PAT with contents:write on <owner>/scoop-bucket, stored as a repo
          # secret. Omit this secret (and the scoops block in .goreleaser.yaml) if
          # you do not publish a Scoop bucket. nFPM (.deb/.rpm) needs no secret.
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
