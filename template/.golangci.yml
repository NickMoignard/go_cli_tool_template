# golangci-lint configuration for this project.
#
# The default linter set (errcheck, govet, ineffassign, staticcheck, unused) is
# kept deliberately conservative. The std-error-handling exclusion preset drops
# the noise from unchecked fmt.Fprint*/Write/Close calls to streams, which are
# idiomatic to ignore.
version: "2"

linters:
  exclusions:
    presets:
      - std-error-handling
