# GoReleaser configuration for a tool scaffolded from go_cli_tool_template.
#
# REPLACE_TOOL / github.com/OWNER/REPLACE_TOOL / REPLACE_DESCRIPTION are sentinel
# tokens the scaffold substitutes (ADR-0003); after instantiation this is a normal
# project config. Cut a release by pushing a tag: `git tag v0.1.0 && git push --tags`
# — the release workflow (.github/workflows/release.yml) runs GoReleaser.
#
# Validate locally without publishing:
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign,sbom
version: 2

project_name: REPLACE_TOOL

before:
  hooks:
    - go mod tidy

builds:
  - id: REPLACE_TOOL
    main: ./cmd/REPLACE_TOOL
    binary: REPLACE_TOOL
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Inject version metadata into internal/version (the vars Get() reads).
    ldflags:
      - -s -w
      - -X github.com/OWNER/REPLACE_TOOL/internal/version.version={{ .Version }}
      - -X github.com/OWNER/REPLACE_TOOL/internal/version.commit={{ .Commit }}
      - -X github.com/OWNER/REPLACE_TOOL/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: REPLACE_TOOL
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Software bill of materials per archive (uses syft).
sboms:
  - artifacts: archive

# Keyless cosign signature over the checksums file (OIDC in CI; no private key).
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Homebrew distribution via a tap (formulae are deprecated; GoReleaser now emits
# a Cask). Create github.com/<owner>/homebrew-tap once; the release workflow
# supplies a PAT that can push to it.
homebrew_casks:
  - name: REPLACE_TOOL
    description: REPLACE_DESCRIPTION
    homepage: "https://github.com/OWNER/REPLACE_TOOL"
    repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    # The binary is unsigned, so strip the macOS quarantine attribute on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/REPLACE_TOOL"]
          end

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
